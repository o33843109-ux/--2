<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ночь в музее</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="card">
      <h1 id="event-title">Ночь в музее</h1>
      <p id="event-date">15 ноября, 18:30</p>
      <p id="event-place">Музей космонавтики, проспект Мира, 111</p>
      <p id="event-description">Вечерняя программа с выставкой и экскурсиями</p>

      <button id="show-program" type="button">Показать программу</button>
      <div id="program" class="program" hidden></div>
    </section>

    <form id="service-form" class="service-box" hidden>
      <p><label><input type="checkbox" id="guide" value="guide"> Экскурсия с гидом</label></p>
      <p><label><input type="checkbox" id="audio" value="audio"> Аудиогид</label></p>
      <p><label><input type="checkbox" id="catalog" value="catalog"> Каталог выставки</label></p>
      <button type="submit">Рассчитать</button>
    </form>

    <p id="choice-error" class="error" hidden>Выберите хотя бы одну услугу.</p>
    <p id="data-error" class="error" hidden>Ошибка данных.</p>

    <div id="result" class="report" hidden></div>
    <pre id="report-json" class="report" hidden></pre>
  </main>

  <script src="app.js"></script>
</body>
</html>
